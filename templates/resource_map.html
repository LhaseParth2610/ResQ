<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Resource Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Map takes full remaining height */
        #map {
            height: 100%;
            width: 100%;
            border-radius: 0.5rem;
        }

        /* Custom scrollbar for the sidebar */
        .camp-list::-webkit-scrollbar {
            width: 6px;
        }

        .camp-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        /* Loading overlay */
        #loading {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans h-screen flex flex-col">

    <!-- Compact Back Button -->
    <div class="bg-white border-b border-gray-200 px-4 py-3">
        <a href="{{ url_for('index') }}" class="inline-flex items-center text-gray-600 hover:text-blue-600 transition">
            <i class="fas fa-arrow-left mr-2"></i>
            <span class="font-medium">Back to Home</span>
        </a>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- Sidebar Controls -->
        <div class="w-full md:w-96 bg-white shadow-xl z-10 flex flex-col border-r border-gray-200">
            <div class="p-6 border-b border-gray-100 bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800 mb-2">Find Help Nearby</h2>
                <p class="text-sm text-gray-500 mb-4">Locate shelters, food, and medical aid.</p>

                <!-- Action Button -->
                <button onclick="findNearestCamp()"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fas fa-location-arrow"></i>
                    <span>Navigate to Nearest Camp</span>
                </button>
                <p id="status-msg" class="text-xs text-center text-gray-500 mt-2 min-h-[1.5rem]"></p>
            </div>

            <!-- Legend -->
            <div class="py-2 px-3 bg-white border-b grid grid-cols-2 gap-2 text-sm">
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal3/icon46.png"
                        class="w-6 h-6 mr-2"> <span>Medical</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal2/icon5.png"
                        class="w-6 h-6 mr-2"> <span>Shelter</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal2/icon40.png"
                        class="w-6 h-6 mr-2"> <span>Food</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal3/icon26.png"
                        class="w-6 h-6 mr-2"> <span>Supplies</span></div>
            </div>

            <!-- List of Locations (Populated via JS) -->
            <div id="camp-list-container" class="camp-list flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                <!-- Items will be injected here -->
                <p class="text-center text-gray-400 mt-10">Loading resources...</p>
            </div>
        </div>

        <!-- Map Area -->
        <div class="flex-1 relative">
            <div id="map"></div>

            <!-- Loading Spinner -->
            <div id="loading"
                class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 text-white">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin text-4xl mb-2"></i>
                    <p>Calculating route...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let userMarker;
        let directionsService;
        let directionsRenderer;
        let allCamps = [];
        let userLocation = null;

        // --- Configuration for Icons (Specific Symbols) ---
        const icons = {
            'Medical': 'https://maps.google.com/mapfiles/kml/pal3/icon46.png', // Red Crossish
            'Shelter': 'https://maps.google.com/mapfiles/kml/pal2/icon5.png', // Home/Bed
            'Food': 'https://maps.google.com/mapfiles/kml/pal2/icon40.png',    // Fork & Knife
            'Clothes': 'https://maps.google.com/mapfiles/kml/pal3/icon26.png', // Shopping/Bag
            'User': 'https://maps.google.com/mapfiles/kml/shapes/man.png'      // The User
        };

        function initMap() {
            // Default View (India Center)
            const defaultLoc = { lat: 20.5937, lng: 78.9629 };

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 5,
                center: defaultLoc,
                mapTypeControl: false,
                fullscreenControl: false,
                streetViewControl: false,
                styles: [
                    { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] } // Clean map
                ]
            });

            // Initialize Directions Service
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true, // We will use our own custom markers
                polylineOptions: { strokeColor: "#2563EB", strokeWeight: 5, strokeOpacity: 0.7 }
            });

            fetchCamps();
        }

        async function fetchCamps() {
            try {
                const response = await fetch('/api/resource_camps');
                allCamps = await response.json();
                renderCampList(allCamps);

                const bounds = new google.maps.LatLngBounds();

                allCamps.forEach(camp => {
                    const pos = { lat: camp.latitude, lng: camp.longitude };
                    addMarker(camp);
                    bounds.extend(pos);
                });

                if (allCamps.length > 0) {
                    map.fitBounds(bounds);
                }
            } catch (error) {
                console.error('Error fetching camps:', error);
            }
        }

        function addMarker(camp) {
            let iconUrl = icons[camp.camp_type] || icons['Food']; // Fallback

            const marker = new google.maps.Marker({
                position: { lat: camp.latitude, lng: camp.longitude },
                map: map,
                title: camp.name,
                icon: {
                    url: iconUrl,
                    scaledSize: new google.maps.Size(32, 32)
                }
            });

            // Info Window
            const infoContent = `
                <div class="p-2 min-w-[200px]">
                    <h3 class="font-bold text-gray-800 text-lg">${camp.name}</h3>
                    <div class="flex items-center mt-1 mb-2">
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded">${camp.camp_type}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> ${camp.location}</p>
                    ${camp.contact_info ? `<p class="text-sm text-gray-600"><i class="fas fa-phone text-green-500 mr-1"></i> ${camp.contact_info}</p>` : ''}
                    <button onclick="routeTo(${camp.latitude}, ${camp.longitude})" class="mt-3 w-full bg-blue-600 text-white text-xs font-bold py-1 px-2 rounded hover:bg-blue-700">
                        Get Directions
                    </button>
                </div>
            `;

            const infoWindow = new google.maps.InfoWindow({ content: infoContent });
            marker.addListener("click", () => infoWindow.open(map, marker));
        }

        function renderCampList(camps) {
            const container = document.getElementById('camp-list-container');
            container.innerHTML = '';

            camps.forEach(camp => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer';
                item.onclick = () => {
                    map.setZoom(15);
                    map.panTo({ lat: camp.latitude, lng: camp.longitude });
                };

                let iconClass = "fa-utensils text-orange-500";
                if (camp.camp_type === 'Medical') iconClass = "fa-briefcase-medical text-red-500";
                if (camp.camp_type === 'Shelter') iconClass = "fa-home text-blue-500";
                if (camp.camp_type === 'Clothes') iconClass = "fa-tshirt text-green-500";

                item.innerHTML = `
                    <div class="flex items-start">
                        <div class="flex-shrink-0 mt-1">
                            <i class="fas ${iconClass} text-lg"></i>
                        </div>
                        <div class="ml-3">
                            <h4 class="font-bold text-gray-800">${camp.name}</h4>
                            <p class="text-xs text-gray-500">${camp.location}</p>
                            ${camp.contact_info ? `<p class="text-xs text-gray-400 mt-1">${camp.contact_info}</p>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // --- Logic to Find Nearest Camp ---
        function findNearestCamp() {
            const statusMsg = document.getElementById('status-msg');
            const loading = document.getElementById('loading');

            statusMsg.textContent = "Requesting your location...";
            statusMsg.className = "text-xs text-center text-blue-600 mt-2 font-semibold";

            if (navigator.geolocation) {
                loading.style.display = 'flex';
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };

                        // Mark User on Map
                        if (userMarker) userMarker.setMap(null);
                        userMarker = new google.maps.Marker({
                            position: userLocation,
                            map: map,
                            icon: {
                                url: icons['User'],
                                scaledSize: new google.maps.Size(40, 40)
                            },
                            title: "You are here",
                            animation: google.maps.Animation.BOUNCE
                        });

                        // Calculate Distances
                        let closestCamp = null;
                        let minDistance = Infinity;

                        allCamps.forEach(camp => {
                            const dist = haversineDistance(userLocation, { lat: camp.latitude, lng: camp.longitude });
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestCamp = camp;
                            }
                        });

                        loading.style.display = 'none';

                        if (closestCamp) {
                            statusMsg.textContent = `Nearest: ${closestCamp.name} (${minDistance.toFixed(2)} km)`;
                            statusMsg.className = "text-xs text-center text-green-600 mt-2 font-bold";
                            routeTo(closestCamp.latitude, closestCamp.longitude);
                        } else {
                            statusMsg.textContent = "No camps found nearby.";
                            statusMsg.className = "text-xs text-center text-red-600 mt-2";
                        }
                    },
                    () => {
                        loading.style.display = 'none';
                        statusMsg.textContent = "Error: Location access denied.";
                        statusMsg.className = "text-xs text-center text-red-600 mt-2";
                    }
                );
            } else {
                statusMsg.textContent = "Geolocation is not supported by this browser.";
            }
        }

        function routeTo(destLat, destLng) {
            if (!userLocation) {
                // If user location isn't set, try to get it first
                findNearestCamp();
                return;
            }

            const request = {
                origin: userLocation,
                destination: { lat: destLat, lng: destLng },
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, function (result, status) {
                if (status == 'OK') {
                    directionsRenderer.setDirections(result);
                    // Add a custom marker for the destination because directionsRenderer might hide standard ones
                    // or just rely on the line.
                } else {
                    alert("Could not calculate directions: " + status);
                }
            });
        }

        // Simple Haversine Formula for client-side distance
        function haversineDistance(coords1, coords2) {
            function toRad(x) { return x * Math.PI / 180; }
            var lat1 = coords1.lat;
            var lon1 = coords1.lng;
            var lat2 = coords2.lat;
            var lon2 = coords2.lng;

            var R = 6371; // km
            var dLat = toRad(lat2 - lat1);
            var dLon = toRad(lon2 - lon1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            var d = R * c;
            return d;
        }
    </script>

    <!-- Fetch API Key dynamically -->
    <script>
        fetch('/api/maps/key')
            .then(response => response.json())
            .then(data => {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${data.api_key}&callback=initMap`;
                script.async = true;
                script.defer = true;
                document.head.appendChild(script);
            })
            .catch(err => console.error("Failed to load Maps API Key", err));
    </script>

    <!-- Mobile Bottom Navigation -->
    <style>
        @media (max-width: 768px) {
            body {
                padding-bottom: 80px;
            }

            .camp-list {
                max-height: 250px;
            }

            /* Make map bigger on mobile */
            #map {
                min-height: 600px !important;
            }

            /* Adjust sidebar to take more space, pushing map down */
            .w-full.md\:w-96 {
                max-height: 450px;
            }
        }

        .mobile-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            padding: 8px 0;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .mobile-bottom-nav .nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .mobile-bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 12px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            border-radius: 8px;
        }

        .mobile-bottom-nav .nav-item:hover,
        .mobile-bottom-nav .nav-item.active {
            color: #2563eb;
            background: #eff6ff;
        }

        .mobile-bottom-nav .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
    <nav class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="{{ url_for('index') }}" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="{{ url_for('safe_route') }}" class="nav-item">
                <i class="fas fa-route"></i>
                <span>Safe Route</span>
            </a>
            <a href="{{ url_for('alerts') }}" class="nav-item">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
            </a>
            <a href="{{ url_for('resource_map') }}" class="nav-item active">
                <i class="fas fa-campground"></i>
                <span>Camps</span>
            </a>
            <a href="{{ url_for('report') }}" class="nav-item">
                <i class="fas fa-edit"></i>
                <span>Report</span>
            </a>
        </div>
    </nav>

</body>

</html>
