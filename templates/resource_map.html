<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Resource Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        #map {
            height: 100%;
            width: 100%;
        }

        /* --- SIDEBAR DRAWER (Glassmorphism) --- */
        #resource-drawer {
            position: fixed; top: 0; left: 0; height: 100vh; width: 85%; max-width: 340px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            z-index: 3000;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 25px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.5);
        }
        #resource-drawer.open { transform: translateX(0); }

        #drawer-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(3px);
            z-index: 2900; display: none; opacity: 0; transition: opacity 0.3s;
        }
        #drawer-backdrop.visible { display: block; opacity: 1; }

        .camp-list::-webkit-scrollbar { width: 5px; }
        .camp-list::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* --- FULLSCREEN --- */
        .map-fullscreen {
            position: fixed !important; top: 0; left: 0;
            width: 100vw !important; height: 100vh !important;
            z-index: 2000 !important;
        }

        /* --- MAP CONTROLS --- */
        
        /* Map Title Overlay */
        .map-title-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); /* Indigo Gradient */
            color: white;
            padding: 8px 18px; border-radius: 99px;
            box-shadow: 0 8px 20px rgba(67, 56, 202, 0.3);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px; font-weight: 800; letter-spacing: 1px;
            display: flex; align-items: center;
        }
        
        .live-dot {
            width: 8px; height: 8px; background: #fff;
            border-radius: 50%; display: inline-block; margin-right: 8px;
            animation: pulse-white 2s infinite;
        }
        @keyframes pulse-white { 
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); } 
            70% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Fullscreen Button */
        .expand-btn {
            position: absolute; top: 20px; right: 20px; 
            z-index: 100; background: white; color: #475569;
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); cursor: pointer;
            transition: all 0.2s; border: 1px solid #e2e8f0;
        }
        .expand-btn:hover { background: #f8fafc; color: #4f46e5; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .expand-btn:active { transform: scale(0.95); }

        #loading { display: none; } 

        /* --- LAYOUT --- */
        @media (max-width: 768px) {
            body { padding-bottom: 80px; }
            .main-panel-height { height: auto; flex-shrink: 0; }
            .map-container-mobile { height: 100%; flex: 1; }
        }
        @media (min-width: 769px) {
            .main-panel-height { width: 26rem; height: 100%; border-right: 1px solid #e2e8f0; }
        }

        /* --- BOTTOM NAV --- */
        .mobile-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            z-index: 1000; padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid #f1f5f9;
        }
        .mobile-bottom-nav .nav-items { display: flex; justify-content: space-around; }
        .mobile-bottom-nav .nav-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 12px; color: #94a3b8; text-decoration: none;
            font-size: 11px; font-weight: 600; border-radius: 12px;
            transition: all 0.2s;
        }
        .mobile-bottom-nav .nav-item:hover { color: #4f46e5; background: #eff6ff; }
        .mobile-bottom-nav .nav-item.active { color: #4f46e5; background: #eff6ff; }

        /* --- SOS BUTTON --- */
        .mobile-sos-bar { position: fixed; bottom: 90px; left: 24px; right: 24px; z-index: 999; }
        .mobile-sos-btn {
            width: 100%; background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); 
            color: white; padding: 16px 24px; border-radius: 20px; border: none;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5); font-weight: 800; font-size: 18px; cursor: pointer;
            transition: transform 0.2s;
        }
        .mobile-sos-btn:active { transform: scale(0.98); }
        
        /* --- MODAL --- */
        .custom-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 5000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .custom-modal-box {
            background: white; width: 85%; max-width: 320px;
            border-radius: 24px; padding: 24px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-btn-ok {
            background: #0f172a; color: white; width: 100%; padding: 14px;
            border-radius: 14px; font-weight: 700; border: none; margin-top: 20px;
        }
    </style>
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <div id="top-nav" class="bg-white border-b border-gray-100 px-6 py-4 shrink-0">
        <a href="{{ url_for('index') }}" class="inline-flex items-center text-gray-500 hover:text-indigo-600 transition font-bold text-sm">
            <i class="fas fa-arrow-left mr-2"></i>
            <span>Back to Home</span>
        </a>
    </div>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <div id="main-panel" class="bg-white shadow-xl z-10 flex flex-col main-panel-height relative">
            <div class="p-6 border-b border-gray-100 bg-white shrink-0">
                <div class="flex justify-between items-start mb-5">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Resources</h2>
                        <p class="text-xs font-semibold text-slate-400 mt-1 uppercase tracking-wide">Nearby Aid & Shelters</p>
                    </div>
                    <button onclick="toggleDrawer()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-100 transition shadow-sm" title="View List">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                </div>

                <button onclick="findNearestCamp()"
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-100 transition transform active:scale-[0.98] flex items-center justify-center space-x-2 text-sm tracking-wide">
                    <i class="fas fa-location-arrow"></i>
                    <span>Navigate to Nearest</span>
                </button>
                <p id="status-msg" class="text-xs text-center text-slate-500 mt-3 font-medium min-h-[1.5rem]"></p>
            </div>

            <div class="p-5 bg-slate-50/80 border-b border-gray-100 grid grid-cols-2 gap-3 text-xs font-bold text-slate-600 shrink-0">
                <div class="flex items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm"><img src="https://maps.google.com/mapfiles/kml/pal3/icon46.png" class="w-5 h-5 mr-2"> <span>Medical</span></div>
                <div class="flex items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm"><img src="https://maps.google.com/mapfiles/kml/pal2/icon5.png" class="w-5 h-5 mr-2"> <span>Shelter</span></div>
                <div class="flex items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm"><img src="https://maps.google.com/mapfiles/kml/pal2/icon40.png" class="w-5 h-5 mr-2"> <span>Food</span></div>
                <div class="flex items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm"><img src="https://maps.google.com/mapfiles/kml/pal3/icon26.png" class="w-5 h-5 mr-2"> <span>Supplies</span></div>
            </div>
        </div>

        <div id="map-container" class="flex-1 relative map-container-mobile">
            <div id="map"></div>
            
            <div class="map-title-overlay">
                <div class="live-dot"></div> LIVE MAP
            </div>

            <button class="expand-btn" onclick="toggleMapFullscreen()" title="Fullscreen">
                <i id="fullscreen-icon" class="fas fa-expand"></i>
            </button>
            
            <div id="loading" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 text-slate-800">
                <div class="text-center">
                    <i class="fas fa-circle-notch fa-spin text-4xl mb-3 text-indigo-600"></i>
                    <p class="font-bold text-sm">Locating...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="drawer-backdrop" onclick="toggleDrawer()"></div>
    <div id="resource-drawer">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center shrink-0 bg-white">
            <h3 class="font-bold text-lg text-slate-800">All Resources</h3>
            <button onclick="toggleDrawer()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-red-50 hover:text-red-500 transition">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="camp-list-container" class="camp-list flex-1 overflow-y-auto p-4 space-y-3">
            <p class="text-center text-slate-400 mt-10 text-sm">Loading resources...</p>
        </div>
    </div>

    <div class="mobile-sos-bar">
        <button id="sos-btn" class="mobile-sos-btn" onclick="triggerSOS()">
            <span class="flex items-center gap-3"><i class="fas fa-broadcast-tower pulse-icon"></i> <span id="sos-text">SOS Call</span></span>
            <i class="fas fa-phone-alt"></i>
        </button>
    </div>

    <div id="custom-modal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600">
                <i class="fas fa-check text-2xl"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-800 mb-2">ACKNOWLEDGED</h3>
            <p class="text-sm text-slate-500 leading-relaxed">Emergency Signal Received.<br>Help is on the way.</p>
            <button id="ack-close-btn" class="modal-btn-ok hover:bg-slate-800 transition">OK</button>
        </div>
    </div>

    <nav class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="{{ url_for('index') }}" class="nav-item"><i class="fas fa-home"></i> <span>Home</span></a>
            <a href="#" onclick="checkAuth(event, '{{ url_for('report') }}')" class="nav-item"><i class="fas fa-edit"></i> <span>Report</span></a>
            <a href="{{ url_for('alerts') }}" class="nav-item"><i class="fas fa-bell"></i> <span>Alerts</span></a>
            <a href="{{ url_for('resource_map') }}" class="nav-item active"><i class="fas fa-campground"></i> <span>Camps</span></a>
            <a href="#" onclick="checkAuth(event, '{{ url_for('safe_route') }}')" class="nav-item"><i class="fas fa-route"></i> <span>Safe Route</span></a>
        </div>
    </nav>

    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let allCamps = [];
        let isFullscreen = false;

        const icons = {
            'Medical': 'https://maps.google.com/mapfiles/kml/pal3/icon46.png',
            'Shelter': 'https://maps.google.com/mapfiles/kml/pal2/icon5.png',
            'Food': 'https://maps.google.com/mapfiles/kml/pal2/icon40.png',
            'Clothes': 'https://maps.google.com/mapfiles/kml/pal3/icon26.png',
            'User': 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'
        };

        function initMap() {
            const defaultLoc = { lat: 18.6279, lng: 73.8004 }; 
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13, center: defaultLoc, disableDefaultUI: true,
                styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }]
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true });

            fetch("/danger_zones").then(r => r.json()).then(data => {
                const heatmapData = data.map(zone => ({ location: new google.maps.LatLng(zone.latitude, zone.longitude), weight: zone.report_count }));
                new google.maps.visualization.HeatmapLayer({ data: heatmapData, map: map, radius: 35, opacity: 0.6 }).setMap(map);
            });

            fetchCamps();
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                     map.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });
                }, () => {});
            }
        }

        function toggleDrawer() {
            const drawer = document.getElementById('resource-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            drawer.classList.toggle('open');
            backdrop.classList.toggle('visible');
        }

        async function fetchCamps() {
            try {
                const response = await fetch('/api/resource_camps');
                allCamps = await response.json();
                renderCampList(allCamps);
                allCamps.forEach(camp => addMarker(camp));
            } catch (error) {
                console.error('Error fetching camps:', error);
                document.getElementById('camp-list-container').innerHTML = '<p class="text-center text-red-500 mt-4">Failed to load resources.</p>';
            }
        }

        function renderCampList(camps) {
            const container = document.getElementById('camp-list-container');
            container.innerHTML = '';
            
            if (camps.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 mt-4">No camps found nearby.</p>';
                return;
            }

            camps.forEach(camp => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition duration-200 cursor-pointer flex items-center justify-between group';
                
                item.onclick = () => {
                    toggleDrawer(); 
                    if (!isFullscreen) toggleMapFullscreen(); 
                    map.setZoom(16);
                    map.panTo({ lat: camp.latitude, lng: camp.longitude });
                };

                let iconClass = "fa-utensils text-orange-500";
                let bgClass = "bg-orange-50";
                
                if (camp.camp_type === 'Medical') { iconClass = "fa-briefcase-medical text-red-500"; bgClass = "bg-red-50"; }
                else if (camp.camp_type === 'Shelter') { iconClass = "fa-home text-blue-500"; bgClass = "bg-blue-50"; }
                else if (camp.camp_type === 'Clothes') { iconClass = "fa-tshirt text-green-500"; bgClass = "bg-green-50"; }

                item.innerHTML = `
                    <div class="flex items-center w-full">
                        <div class="w-10 h-10 ${bgClass} rounded-full flex items-center justify-center flex-shrink-0 mr-4">
                            <i class="fas ${iconClass}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-slate-800 text-sm truncate group-hover:text-indigo-600 transition">${camp.name}</h4>
                            <p class="text-xs text-slate-500 truncate flex items-center gap-1">
                                <i class="fas fa-map-marker-alt text-slate-300"></i> ${camp.location}
                            </p>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300 text-xs ml-2"></i>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleMapFullscreen() {
            const mapContainer = document.getElementById('map-container');
            const icon = document.getElementById('fullscreen-icon');
            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                mapContainer.classList.add('map-fullscreen');
                icon.className = 'fas fa-compress text-slate-700';
            } else {
                mapContainer.classList.remove('map-fullscreen');
                icon.className = 'fas fa-expand text-slate-700';
            }
            setTimeout(() => { google.maps.event.trigger(map, "resize"); }, 300);
        }

        function addMarker(camp) {
            let iconUrl = icons[camp.camp_type] || icons['Food'];
            const marker = new google.maps.Marker({
                position: { lat: camp.latitude, lng: camp.longitude },
                map: map, title: camp.name, icon: { url: iconUrl }
            });
            
            // UPDATED: Matching the Manage Page Popup Content
            const infoContent = `
                <div class="p-2 min-w-[200px]">
                    <h3 class="font-bold text-gray-800 text-lg">${camp.name}</h3>
                    <div class="flex items-center mt-1 mb-2">
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded">${camp.camp_type}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> ${camp.location}</p>
                    ${camp.contact_info ? `<p class="text-sm text-gray-600"><i class="fas fa-phone text-green-500 mr-1"></i> ${camp.contact_info}</p>` : ''}
                    <button onclick="routeTo(${camp.latitude}, ${camp.longitude})" class="mt-3 w-full bg-indigo-600 text-white text-xs py-1.5 rounded font-bold hover:bg-indigo-700 transition">Navigate Here</button>
                </div>
            `;
            
            const infoWindow = new google.maps.InfoWindow({ content: infoContent });
            marker.addListener("click", () => infoWindow.open(map, marker));
        }

        function findNearestCamp() {
            const statusMsg = document.getElementById('status-msg');
            const loading = document.getElementById('loading');
            
            statusMsg.textContent = "";
            loading.style.display = 'flex'; 

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                        let closestCamp = null;
                        let minDist = Infinity;
                        
                        allCamps.forEach(camp => {
                             const d = Math.sqrt(Math.pow(camp.latitude - userLocation.lat, 2) + Math.pow(camp.longitude - userLocation.lng, 2));
                             if(d < minDist) { minDist = d; closestCamp = camp; }
                        });

                        loading.style.display = 'none';

                        if (closestCamp) {
                            statusMsg.textContent = `Nearest: ${closestCamp.name}`;
                            map.setZoom(15);
                            map.panTo({ lat: closestCamp.latitude, lng: closestCamp.longitude });
                        } else {
                            statusMsg.textContent = "No camps found.";
                        }
                    },
                    () => { 
                        loading.style.display = 'none'; 
                        statusMsg.textContent = "Location denied."; 
                    }
                );
            } else {
                loading.style.display = 'none';
                statusMsg.textContent = "Geolocation not supported.";
            }
        }

        function checkAuth(e, url) { e.preventDefault(); window.location.href = url; }
        
        function triggerSOS() {
            const btn = document.getElementById('sos-btn'); const text = document.getElementById('sos-text'); const modal = document.getElementById('custom-modal');
            if(btn) { btn.disabled = true; btn.style.background = "#059669"; }
            if(text) text.innerText = "Sending...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    fetch('/api/send_sos', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).then(() => {
                        if(text) text.innerText = "Signal Sent!";
                        setTimeout(() => { if(modal) modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = '1', 10); }, 300);
                    });
                });
                setTimeout(() => { if(btn) { btn.disabled = false; btn.style.background = "linear-gradient(135deg, #dc2626, #b91c1c)"; text.innerText = "SOS Call"; } }, 30000);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const closeBtn = document.getElementById('ack-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', () => { document.getElementById('custom-modal').style.display = 'none'; });
        });

        fetch('/api/maps/key').then(r => r.json()).then(data => {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${data.api_key}&libraries=visualization&callback=initMap`;
            document.head.appendChild(s);
        });
    </script>
</body>
</html>
