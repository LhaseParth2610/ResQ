<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Manage Resource Camps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        #map {
            height: 100%;
            width: 100%;
            border-radius: 0.5rem;
        }

        .camp-list::-webkit-scrollbar {
            width: 6px;
        }

        .camp-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover {
            color: #000;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-blue-900 text-white shadow-lg z-10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-hand-holding-heart text-2xl text-red-400"></i>
                <h1 class="text-2xl font-bold tracking-wide">ResQ <span class="text-blue-200 font-light">Resource
                        Management</span></h1>
            </div>
            <a href="{{ url_for('authority_dashboard') }}"
                class="flex items-center space-x-2 hover:text-blue-200 transition">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Dashboard</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- Sidebar Controls -->
        <div class="w-full md:w-96 bg-white shadow-xl z-10 flex flex-col border-r border-gray-200">
            <div class="p-6 border-b border-gray-100 bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800 mb-2">Resource Camps</h2>
                <p class="text-sm text-gray-500 mb-4">Add, view, and manage resource camps.</p>

                <!-- Add Camp Button -->
                <button onclick="openModal()"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>Add Resource Camp</span>
                </button>
            </div>

            <!-- Legend -->
            <div class="p-4 bg-white border-b grid grid-cols-2 gap-2 text-sm">
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal3/icon46.png"
                        class="w-6 h-6 mr-2"> <span>Medical</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal2/icon5.png"
                        class="w-6 h-6 mr-2"> <span>Shelter</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal2/icon40.png"
                        class="w-6 h-6 mr-2"> <span>Food</span></div>
                <div class="flex items-center"><img src="https://maps.google.com/mapfiles/kml/pal3/icon26.png"
                        class="w-6 h-6 mr-2"> <span>Supplies</span></div>
            </div>

            <!-- List of Camps -->
            <div id="camp-list-container" class="camp-list flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                <p class="text-center text-gray-400 mt-10">Loading camps...</p>
            </div>
        </div>

        <!-- Map Area -->
        <div class="flex-1 relative">
            <div id="map"></div>
        </div>
    </div>

    <!-- Add Camp Modal -->
    <div id="addCampModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Add Resource Camp</h2>

            <form id="addCampForm" onsubmit="addCamp(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Camp Name</label>
                    <input type="text" id="camp_name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., Central Community Shelter">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Camp Type</label>
                    <select id="camp_type" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select Type...</option>
                        <option value="Medical">🏥 Medical Aid</option>
                        <option value="Shelter">🏠 Shelter</option>
                        <option value="Food">🍽️ Food Distribution</option>
                        <option value="Clothes">👕 Supplies & Clothing</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Location Address</label>
                    <input type="text" id="location" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., 123 Main St, Mumbai, India">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Contact Info (Optional)</label>
                    <input type="text" id="contact"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g., +91 98765 43210">
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">
                    Add Camp
                </button>
            </form>
        </div>
    </div>

    <script>
        let map;
        let allCamps = [];
        let markers = [];

        const icons = {
            'Medical': 'https://maps.google.com/mapfiles/kml/pal3/icon46.png',
            'Shelter': 'https://maps.google.com/mapfiles/kml/pal2/icon5.png',
            'Food': 'https://maps.google.com/mapfiles/kml/pal2/icon40.png',
            'Clothes': 'https://maps.google.com/mapfiles/kml/pal3/icon26.png'
        };

        function initMap() {
            const defaultLoc = { lat: 20.5937, lng: 78.9629 };

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 5,
                center: defaultLoc,
                mapTypeControl: false,
                fullscreenControl: false,
                streetViewControl: false
            });

            fetchCamps();
        }

        async function fetchCamps() {
            try {
                const response = await fetch('/api/resource_camps');
                allCamps = await response.json();
                renderCampList(allCamps);
                renderMapMarkers(allCamps);
            } catch (error) {
                console.error('Error fetching camps:', error);
            }
        }

        function renderMapMarkers(camps) {
            // Clear existing markers
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            const bounds = new google.maps.LatLngBounds();

            camps.forEach(camp => {
                const pos = { lat: camp.latitude, lng: camp.longitude };
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    title: camp.name,
                    icon: {
                        url: icons[camp.camp_type] || icons['Food'],
                        scaledSize: new google.maps.Size(32, 32)
                    }
                });

                const infoContent = `
                    <div class="p-2 min-w-[200px]">
                        <h3 class="font-bold text-gray-800 text-lg">${camp.name}</h3>
                        <div class="flex items-center mt-1 mb-2">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded">${camp.camp_type}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> ${camp.location}</p>
                        ${camp.contact_info ? `<p class="text-sm text-gray-600"><i class="fas fa-phone text-green-500 mr-1"></i> ${camp.contact_info}</p>` : ''}
                    </div>
                `;

                const infoWindow = new google.maps.InfoWindow({ content: infoContent });
                marker.addListener("click", () => infoWindow.open(map, marker));

                markers.push(marker);
                bounds.extend(pos);
            });

            if (camps.length > 0) {
                map.fitBounds(bounds);
            }
        }

        function renderCampList(camps) {
            const container = document.getElementById('camp-list-container');
            container.innerHTML = '';

            if (camps.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 mt-10">No camps added yet.</p>';
                return;
            }

            camps.forEach(camp => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition';

                let iconClass = "fa-utensils text-orange-500";
                if (camp.camp_type === 'Medical') iconClass = "fa-briefcase-medical text-red-500";
                if (camp.camp_type === 'Shelter') iconClass = "fa-home text-blue-500";
                if (camp.camp_type === 'Clothes') iconClass = "fa-tshirt text-green-500";

                item.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-start flex-1">
                            <div class="flex-shrink-0 mt-1">
                                <i class="fas ${iconClass} text-lg"></i>
                            </div>
                            <div class="ml-3">
                                <h4 class="font-bold text-gray-800">${camp.name}</h4>
                                <p class="text-xs text-gray-500">${camp.location}</p>
                                ${camp.contact_info ? `<p class="text-xs text-gray-400 mt-1">${camp.contact_info}</p>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteCamp(${camp.id})" class="ml-2 text-red-500 hover:text-red-700 transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function openModal() {
            document.getElementById('addCampModal').style.display = 'block';
        }

        function closeModal() {
        const modal = document.getElementById('custom-modal');
        
        if (modal) {
            // 1. Fade out
            modal.style.opacity = '0';
            
            // 2. Try to scale down the box (only if it exists)
            const box = modal.querySelector('.custom-modal-box');
            if (box) {
                box.style.transform = 'scale(0.9)';
            }

            // 3. Hide completely after animation
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        } else {
            console.error("Error: Could not find modal with id 'custom-modal'");
        }
    }

        async function addCamp(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append('name', document.getElementById('camp_name').value);
            formData.append('camp_type', document.getElementById('camp_type').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('contact', document.getElementById('contact').value);

            try {
                const response = await fetch('/add_resource_camp', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    closeModal();
                    await fetchCamps(); // Refresh camps list
                    alert('Camp added successfully!');
                } else {
                    alert('Failed to add camp. Please try again.');
                }
            } catch (error) {
                console.error('Error adding camp:', error);
                alert('Error adding camp. Please try again.');
            }
        }

        async function deleteCamp(campId) {
            if (!confirm('Are you sure you want to delete this camp?')) {
                return;
            }

            try {
                const response = await fetch(`/delete_resource_camp/${campId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await fetchCamps(); // Refresh camps list
                    alert('Camp deleted successfully!');
                } else {
                    alert('Failed to delete camp. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting camp:', error);
                alert('Error deleting camp. Please try again.');
            }
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('addCampModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

    <!-- Fetch API Key dynamically -->
    <script>
        fetch('/api/maps/key')
            .then(response => response.json())
            .then(data => {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${data.api_key}&callback=initMap`;
                script.async = true;
                script.defer = true;
                document.head.appendChild(script);
            })
            .catch(err => console.error("Failed to load Maps API Key", err));
    </script>

</body>

</html>
